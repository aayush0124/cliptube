<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src https: data:; script-src 'self'">
<title>ClipTube</title>
<style>
  :root{
    --bg:#262624; --bg2:#30302e; --card:#2e2d2b; --line:#3d3c39;
    --text:#f0eee6; --muted:#a8a49c; --accent:#d97757; --accent-h:#e08a6d;
    --ok:#7fb069; --err:#e5735f; --radius:14px;
    font-size:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); min-height:100vh;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:34px 20px 50px;
    user-select:none;
  }
  input,select{user-select:text}
  .logo{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .logo-mark{
    width:40px;height:40px;border-radius:12px;background:var(--accent);
    display:grid;place-items:center;font-size:19px;
  }
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:1.8rem;letter-spacing:-.01em}
  .tagline{color:var(--muted);margin:6px 0 14px;font-size:.92rem}
  .tagline b{color:var(--accent);font-weight:600}

  #setup{
    display:none;align-items:center;gap:10px;margin-bottom:14px;
    background:var(--bg2);border:1px solid var(--line);border-radius:99px;
    padding:8px 18px;font-size:.85rem;color:var(--muted);
  }
  #setup.show{display:flex}
  .spinner{
    width:14px;height:14px;border-radius:50%;border:2px solid var(--line);
    border-top-color:var(--accent);animation:spin .8s linear infinite;flex-shrink:0;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .app{width:100%;max-width:620px;display:flex;flex-direction:column;gap:14px}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px;
  }
  label{display:block;font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
  input,select{
    width:100%; background:var(--bg2); border:1px solid var(--line); border-radius:10px;
    color:var(--text); padding:11px 14px; font-size:1rem; outline:none;
    transition:border-color .15s; font-family:inherit;
  }
  input:focus,select:focus{border-color:var(--accent)}
  input::placeholder{color:#6f6c65}

  .url-row{display:flex;gap:10px}
  .url-row input{flex:1}
  .btn{
    background:var(--accent); color:#1a1917; border:none; border-radius:10px;
    padding:11px 20px; font-size:.93rem; font-weight:600; cursor:pointer;
    transition:background .15s, transform .05s; font-family:inherit; white-space:nowrap;
  }
  .btn:hover{background:var(--accent-h)}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:var(--bg2);color:var(--text);border:1px solid var(--line)}
  .btn.big{width:100%;padding:14px;font-size:1.02rem;margin-top:4px}

  #preview{display:none;gap:16px;align-items:center}
  #preview.show{display:flex}
  #preview img{width:140px;border-radius:10px;border:1px solid var(--line)}
  #preview .meta{min-width:0}
  #preview .title{font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #preview .sub{color:var(--muted);font-size:.84rem;margin-top:6px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .hint{color:var(--muted);font-size:.79rem;margin-top:8px}
  code{background:var(--bg2);border-radius:5px;padding:1px 6px;font-size:.78rem}
  .chk{display:flex;align-items:center;gap:9px;padding:11px 2px;cursor:pointer}
  .chk input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
  .chk span{font-size:.9rem;color:var(--muted)}

  #status{display:none}
  #status.show{display:block}
  .bar{height:9px;background:var(--bg2);border-radius:99px;overflow:hidden;margin:12px 0 10px}
  .bar i{display:block;height:100%;width:0%;background:var(--accent);border-radius:99px;transition:width .4s}
  .status-line{display:flex;justify-content:space-between;font-size:.86rem;color:var(--muted)}
  .status-line .pct{color:var(--text);font-weight:600}
  #done-row{display:none;gap:10px;margin-top:14px;flex-wrap:wrap}
  #done-row.show{display:flex}
  #done-row .btn{flex:1;min-width:130px}
  .msg-ok{color:var(--ok)} .msg-err{color:var(--err)}

  footer{margin-top:30px;color:#6f6c65;font-size:.78rem;display:flex;gap:14px;align-items:center}
  footer a{color:var(--muted);cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
  <div class="logo">
    <div class="logo-mark">✂️</div>
    <h1>ClipTube</h1>
  </div>
  <p class="tagline">Download <b>exactly the part you need</b> from any YouTube video</p>
  <div id="setup" class="show"><div class="spinner"></div><span id="setupMsg">Getting ready…</span></div>

  <div class="app">
    <div class="card">
      <label for="url">YouTube link</label>
      <div class="url-row">
        <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=…" autocomplete="off" spellcheck="false">
        <button class="btn ghost" id="fetchBtn">Fetch</button>
      </div>
      <p class="hint" id="urlHint">Paste a link, then hit Fetch to preview the video.</p>
    </div>

    <div class="card" id="preview">
      <img id="thumb" alt="thumbnail">
      <div class="meta">
        <div class="title" id="vTitle"></div>
        <div class="sub" id="vSub"></div>
      </div>
    </div>

    <div class="card">
      <div class="grid">
        <div>
          <label for="start">Start time</label>
          <input id="start" placeholder="0:45" autocomplete="off" spellcheck="false">
        </div>
        <div>
          <label for="end">End time</label>
          <input id="end" placeholder="2:30" autocomplete="off" spellcheck="false">
        </div>
      </div>
      <p class="hint">Formats: <code>SS</code>, <code>MM:SS</code> or <code>H:MM:SS</code> — e.g. <code>90</code>, <code>1:30</code>, <code>1:02:15</code></p>

      <div class="grid" style="margin-top:14px">
        <div>
          <label for="quality">Quality</label>
          <select id="quality">
            <option value="1080">1080p</option>
            <option value="720" selected>720p</option>
            <option value="480">480p</option>
            <option value="best">Best available</option>
          </select>
        </div>
        <div>
          <label>&nbsp;</label>
          <label class="chk" style="margin:0"><input type="checkbox" id="audioOnly"><span>Audio only (MP3)</span></label>
        </div>
      </div>

      <button class="btn big" id="goBtn">Download clip</button>
    </div>

    <div class="card" id="status">
      <label>Progress</label>
      <div class="bar"><i id="barFill"></i></div>
      <div class="status-line"><span id="statusMsg">Starting…</span><span class="pct" id="pct">0%</span></div>
      <div id="done-row">
        <button class="btn" id="openBtn">▶ Open clip</button>
        <button class="btn ghost" id="showBtn">📂 Show in folder</button>
        <button class="btn ghost" id="resetBtn">New clip</button>
      </div>
    </div>
  </div>

  <footer>
    <span>Clips are saved to Downloads · ClipTube</span>
    <a id="folderLink">Open clips folder</a>
  </footer>

<script src="app.js"></script>
</body>
</html>
